<style>

.toast button{background:transparent;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer;font-size:14px}

.namein{font-weight:600;font-size:16px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<body>

<div class="wrap">
  <header><h1>Budget du foyer</h1><span class="sync" id="sync">Enregistré sur cet appareil</span></header>

<script>
(function(){
const LS='budget-foyer-v1';
const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
const r3=n=>Math.round(n*1000)/1000;
const fmt=n=>Math.round(n||0).toLocaleString('fr-FR')+' DA';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curMonth=()=>today().slice(0,7);
const monthLabel=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})};
const dateLabel=s=>{if(!s)return 'aucune';const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d||1).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);

const CATS=[['leg','Légumes','ali'],['fru','Fruits','ali'],['vol','Viandes, poulet et œufs','ali'],['epi','Épicerie et féculents','ali'],['pai','Pain','ali'],['lai','Produits laitiers','ali'],['poi','Poissons et conserves','ali'],['boi','Boissons','ali'],['men','Ménage et détergents','men'],['hyg','Hygiène','men']];
const GROUPS={ali:'Alimentation',men:'Ménage et hygiène',fac:'Factures',div:'Divers'};
const catGroup=id=>(CATS.find(c=>c[0]===id)||[])[2]||'ali';
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYFULL={Lun:'Lundi',Mar:'Mardi',Mer:'Mercredi',Jeu:'Jeudi',Ven:'Vendredi',Sam:'Samedi',Dim:'Dimanche'};
const TRIPS=[['Tipaza','Ruines romaines, port et bord de mer'],['Chréa','Parc national, balade en forêt, neige en hiver'],['Hammam Righa','Bains thermaux et repos'],['Cherchell','Musée, port et vieille ville'],['Médéa','Jardins et promenades en altitude'],['Alger','Casbah, Jardin d’Essai, front de mer'],['Tikjda','Montagne du Djurdjura, air frais']];

function defaults(){
  const raw=[
    ['leg','Pomme de terre','kg',10],['leg','Carotte','kg',3],['leg','Courgette','kg',3],['leg','Oignons','kg',4],['leg','Ail','kg',0.25],['leg','Salade','pièce',4],['leg','Poivrons','kg',2],['leg','Chou-fleur','pièce',3],['leg','Laitue verte','pièce',4],
    ['fru','Fruits de saison','kg',8],
    ['vol','Œufs','plateau de 30',1],['vol','Poulet','kg',6],['vol','Viande','kg',2],
    ['epi','Huile','litre',5],['epi','Beurre / margarine','pièce',3],['epi','Pâtes','paquet',8],['epi','Légumineuses','kg',3],['epi','Dyoul (feuilles de pâte)','paquet',2],
    ['pai','Pain','baguette',30],
    ['lai','Yaourt','pot',30],['lai','Lait','sachet 1 L',30],['lai','Fromage','boîte',3],
    ['poi','Thon en conserve','boîte',6],['poi','Poissons','kg',2],
    ['boi','Boissons','bouteille',8],
    ['men','Pril / Isis (vaisselle)','flacon',1],['men','Savon liquide','flacon',1],['men','Savon','pièce',4],['men','Désodorisant','pièce',1],['men','Sacs poubelle','rouleau',2],['men','Sachets de congélation','paquet',1],['men','Papier essuie-tout','rouleau',4],['men','Lessive machine à laver','flacon',1],
    ['hyg','Serviettes hygiéniques','paquet',2]
  ];
  const fr=[
    ['Œufs','frigo','pièce',6],['Lait','frigo','sachet',2],['Yaourt','frigo','pot',4],['Fromage','frigo','boîte',1],['Beurre / margarine','frigo','pièce',1],
    ['Carotte','frigo','kg',1],['Courgette','frigo','kg',1],['Poivrons','frigo','kg',0.5],['Salade','frigo','pièce',1],['Chou-fleur','frigo','pièce',1],['Laitue verte','frigo','pièce',1],['Fruits de saison','frigo','kg',2],
    ['Poulet','congélateur','kg',1],['Viande','congélateur','kg',0.5],['Poissons','congélateur','kg',0.5],['Dyoul (feuilles de pâte)','congélateur','paquet',1],
    ['Pomme de terre','placard','kg',2],['Oignons','placard','kg',1],['Ail','placard','kg',0.1],['Huile','placard','litre',1],['Pâtes','placard','paquet',2],['Légumineuses','placard','kg',1],['Thon en conserve','placard','boîte',2],['Boissons','placard','bouteille',2]
  ];
  return {
    v:3, month:curMonth(),
    cfg:{income:'80000'},
    env:{ali:'22000',men:'4000',fac:'10000',div:'4000'},
    debts:[{id:'dette-1',name:'Dette principale',total:'660000',goal:'320000',due:'2027-06-30',active:true,rate:''}],
    items:raw.map(r=>({id:uid(),cat:r[0],name:r[1],unit:r[2],qty:String(r[3]),price:'',done:false})),
    bills:[['Électricité et gaz (Sonelgaz)'],['Eau'],['Internet (Algérie Télécom)'],['Téléphone mobile']].map(b=>({id:uid(),name:b[0],amount:'',paid:false})),
    extras:[], pays:[],
    fridge:fr.map(r=>({id:uid(),name:r[0],place:r[1],unit:r[2],qty:'',min:String(r[3]),exp:''})),
    meals:{}, log:[], archive:[],
    save:{goal:'1000000'}, deposits:[],
    esc:{budget:'',every:'3',next:'',dest:''},
    trips:TRIPS.map(t=>({id:uid(),name:t[0],note:t[1],cost:''}))
  };
}
function normalize(o){
  const d=defaults();o=o||{};const s=Object.assign({},d,o);
  s.cfg=Object.assign({},d.cfg,o.cfg||{});s.env=Object.assign({},d.env,o.env||{});
  s.save=Object.assign({},d.save,o.save||{});s.esc=Object.assign({},d.esc,o.esc||{});
  ['items','bills','extras','pays','fridge','log','archive','deposits','trips'].forEach(k=>{if(!Array.isArray(o[k]))s[k]=(o[k]&&Array.isArray(o[k]))?o[k]:d[k]});
  if(!Array.isArray(o.deposits))s.deposits=[];
  if(!Array.isArray(o.debts)){
    const c=o.cfg||{};
    s.debts=[{id:'dette-1',name:'Dette principale',total:String(c.debtTotal||'660000'),goal:String(c.goal||'320000'),due:(c.deadline||'2027-06')+(String(c.deadline||'2027-06').length===7?'-30':''),active:true,rate:''}];
  }
  s.debts.forEach(x=>{if(x.active===undefined)x.active=true;if(x.rate===undefined)x.rate=''});
  s.pays.forEach(p=>{if(!p.debtId&&s.debts[0])p.debtId=s.debts[0].id});
  const m={};
  if(o.meals&&typeof o.meals==='object')Object.keys(o.meals).forEach(k=>{
    const v=o.meals[k];
    if(DAYS.includes(k)&&v&&('m' in v||'s' in v)){if(v.m)m[k+'-m']={dish:v.m,ings:[],done:false};if(v.s)m[k+'-s']={dish:v.s,ings:[],done:false}}
    else if(v&&typeof v==='object'&&('dish' in v)){m[k]={dish:v.dish||'',ings:Array.isArray(v.ings)?v.ings:[],done:!!v.done}}
  });
  s.meals=m;s.v=3;return s;
}
let S;
try{const j=localStorage.getItem(LS);S=j?normalize(JSON.parse(j)):defaults()}catch(e){S=defaults()}
const hadLocal=(()=>{try{return !!localStorage.getItem(LS)}catch(e){return false}})();
const ui={tab:'home',place:'all',day:DAYS[(new Date().getDay()+6)%7],logKind:'all',logN:60};
let undoJson=null,dl=null;

function logEvt(k,msg){S.log.unshift({id:uid(),t:Date.now(),k,msg});if(S.log.length>400)S.log.length=400}

/* ---------- calculs ---------- */
let R={},T={};
function dur(m){const y=Math.floor(m/12),r=m%12;return (y?y+' an'+(y>1?'s':''):'')+(y&&r?' ':'')+((r||!y)?r+' mois':'')}
function project(oneOff,o){
  o=o||{};const goal=num(S.save.goal);
  if(goal<=0)return {none:true};
  let left=goal-R.saved;if(left<=0)return {done:true,months:0};
  const B=o.base!=null?o.base:R.baseSpend,inc=R.income+(o.inc||0);
  for(let i=0;i<240;i++){
    let req=0;R.dinfo.forEach(x=>{if(x.active&&x.req>0&&x.months>i)req+=x.req});
    left-=inc-req-B-(i===0?oneOff:0);
    if(left<=0)return {months:i+1};
  }
  return {never:true};
}
function savText(p){
  if(p.none)return 'Aucun objectif défini';if(p.done)return 'Objectif atteint';if(p.never)return 'Hors de portée avec ce budget';
  const [cy,cmo]=curMonth().split('-').map(Number);const d=new Date(cy,cmo-1+p.months-1,1);
  return dur(p.months)+' · fin '+d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
}
function calc(){
  R={};T={};const cm=curMonth();
  const plan={ali:0,men:0,fac:0,div:0},spent={ali:0,men:0,fac:0,div:0};
  CATS.forEach(c=>R['cat:'+c[0]]=0);
  let noPrice=0;
  S.items.forEach(it=>{const l=num(it.qty)*num(it.price);const g=catGroup(it.cat);R['line:'+it.id]=l;R['cat:'+it.cat]=(R['cat:'+it.cat]||0)+l;plan[g]+=l;if(it.done)spent[g]+=l;if(!num(it.price))noPrice++});
  S.bills.forEach(b=>{plan.fac+=num(b.amount);if(b.paid)spent.fac+=num(b.amount)});
  S.extras.forEach(e=>{plan.div+=num(e.amount);spent.div+=num(e.amount)});
  const income=num(S.cfg.income);
  const [cy,cmo]=cm.split('-').map(Number);
  let debtReq=0,goalLeft=0,totalLeft=0,afterGoal=0,goalSum=0,paidCap=0,totalSum=0,maxMonths=0,nActive=0;const dinfo=[];
  S.debts.forEach(d=>{
    const active=d.active!==false;
    const mine=S.pays.filter(p=>p.debtId===d.id);
    const paid=sum(mine,p=>num(p.amount));
    const paidM=sum(mine.filter(p=>(p.date||'').slice(0,7)===cm),p=>num(p.amount));
    const total=num(d.total),goal=num(d.goal),before=paid-paidM;
    let months=0,over=false;
    if(d.due){const [dy,dm]=d.due.slice(0,7).split('-').map(Number);months=(dy-cy)*12+(dm-cmo)+1;if(months<1){months=1;over=true}}
    const leftBefore=Math.max(0,goal-before);
    const req=(active&&d.due&&leftBefore>0)?Math.ceil(leftBefore/months/100)*100:0;
    R['d:paid:'+d.id]=paid;R['d:paidM:'+d.id]=paidM;R['d:req:'+d.id]=req;R['d:left:'+d.id]=Math.max(0,goal-paid);
    R['d:totleft:'+d.id]=Math.max(0,total-paid);R['d:goal:'+d.id]=goal;R['d:months:'+d.id]=months;R['d:pct:'+d.id]=goal?Math.min(100,paid/goal*100):0;
    debtReq+=req;goalLeft+=Math.max(0,goal-paid);totalLeft+=Math.max(0,total-paid);afterGoal+=Math.max(0,total-goal);goalSum+=goal;paidCap+=Math.min(paid,goal);totalSum+=total;
    if(active)nActive++;
    if(req>0&&months>maxMonths)maxMonths=months;
    dinfo.push({d,months,over,req,active});
  });
  const paidAll=sum(S.pays,p=>num(p.amount));
  const paidMonth=sum(S.pays.filter(p=>(p.date||'').slice(0,7)===cm),p=>num(p.amount));
  const everyN=num(S.esc.every),escBudget=num(S.esc.budget);
  const escMonthly=(everyN>0&&escBudget>0)?escBudget/everyN:0;
  const saved=sum(S.deposits.filter(x=>x.kind==='epargne'),x=>num(x.amount));
  const escPot=sum(S.deposits.filter(x=>x.kind==='escapade'),x=>num(x.amount))-sum(S.deposits.filter(x=>x.kind==='escapade-out'),x=>num(x.amount));
  const depMonth=sum(S.deposits.filter(x=>(x.date||'').slice(0,7)===cm&&x.kind!=='escapade-out'),x=>num(x.amount));
  const avail=income-debtReq;
  let envSum=0;['ali','men','fac','div'].forEach(g=>{R['plan:'+g]=plan[g];R['spent:'+g]=spent[g];R['env:'+g]=num(S.env[g]);R['rem:'+g]=num(S.env[g])-plan[g];envSum+=num(S.env[g])});
  const baseSpend=plan.ali+plan.men+plan.fac+escMonthly;
  const planSum=baseSpend+plan.div,spentSum=spent.ali+spent.men+spent.fac+spent.div;
  const savGoal=num(S.save.goal);

/* ---------- enregistrement et synchronisation ---------- */
let ref=null,lastJson='',writing=false,pending=false,readOnly=false,timer=null,slowTimer=null,dirty=false,rev=0;
function setSync(s){const el=$('#sync');if(!el)return;
  const m={local:['Enregistré sur cet appareil',''],ok:['Synchronisé','ok'],ro:['Lecture seule, données locales','err'],err:['Hors connexion, données locales','err'],slow:['Synchronisation lente','err']}[s];
  el.textContent=m[0];el.className='sync '+m[1]}
function save(){
  rev++;dirty=true;
  const j=JSON.stringify(S);try{localStorage.setItem(LS,j)}catch(e){}
  if(!ref||readOnly)return;clearTimeout(timer);timer=setTimeout(push,700)}
async function push(){
  if(!ref)return;if(writing){pending=true;return}
  writing=true;const j=JSON.stringify(S);const r0=rev;
  try{await ref.set({json:j,at:Date.now()});lastJson=j;if(rev===r0)dirty=false;setSync('ok')}
  catch(e){if(e&&e.code==='invalid_argument'){readOnly=true;setSync('ro')}else setSync('err')}
  writing=false;if(pending){pending=false;push()}
}
function mergeLocalInto(local,remote){
  const out=JSON.parse(JSON.stringify(local));
  ['log','pays','extras','archive','deposits'].forEach(k=>{
    const ids=new Set(out[k].map(x=>x.id||x.month));
    (remote[k]||[]).forEach(x=>{if(!ids.has(x.id||x.month))out[k].push(x)});
  });
  out.log.sort((a,b)=>b.t-a.t);if(out.log.length>400)out.log.length=400;
  return out;
}
async function initStore(){
  if(!(window.claude&&claude.use))return;
  try{dl=await claude.use('downloads')}catch(e){}
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(!db)return;
  ref=db.doc('budget/main');
  slowTimer=setTimeout(()=>setSync('slow'),10000);
  ref.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(!snap.metadata||!snap.metadata.fromCache)clearTimeout(slowTimer);
    if(!snap.exists){if(hadLocal&&!snap.metadata.fromCache)push();else setSync('local');return}
    const j=snap.data().json;
    if(typeof j==='string'&&j!==lastJson){
      try{
        const remote=normalize(JSON.parse(j));lastJson=j;
        if(dirty){S=mergeLocalInto(S,remote);save()}else S=remote;
        try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
        const a=document.activeElement;if(a&&a.closest&&a.closest('#app')&&/INPUT|SELECT/.test(a.tagName))paint();else render();
      }catch(e){}
    }
    setSync(readOnly?'ro':'ok');
  },()=>setSync('err'));
}
async function exportData(){
  const data=JSON.stringify(S,null,1),name='budget-foyer-'+today()+'.json';
  try{
    if(dl){await dl.save({filename:name,data});toast('Sauvegarde proposée au téléchargement.');return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
    toast('Sauvegarde téléchargée.');
  }catch(e){if(!(e&&e.code==='declined'))toast('Téléchargement impossible ici.')}
}

    ['Courses',['Achetez fruits et légumes de saison au marché, souvent moins chers qu’hors saison, et comparez deux ou trois vendeurs.','Les légumineuses (lentilles, pois chiches, haricots) remplacent une partie de la viande à bas coût.','Achetez poulet et viande en quantité au meilleur prix, puis congelez par portions dans des sachets.','Gardez la liste de ce mois et n’achetez que ce qui y figure : les achats imprévus pèsent vite.','Pour les détergents, comparez le prix au litre : les grands formats sont souvent plus avantageux.']],
    ['Cuisine',['Planifiez les repas de la semaine avant de faire les courses, puis cuisinez en priorité ce qui périme bientôt.','Cuisinez en double et congelez une portion pour les soirs pressés.','Le pain rassis se transforme en chapelure ou en plat (mhadjeb, bourek) au lieu d’être jeté.']],
    ['Maison',['Lavez à pleine charge et à basse température, et débranchez les appareils en veille.','Surveillez vos factures d’électricité, de gaz et d’eau : une fuite ou un appareil énergivore se repère sur la durée.','Comparez les offres internet et téléphone au moment de renouveler.']],
    ['Revenus et dette',['Un petit revenu complémentaire, même régulier à faible montant, accélère plus que des économies difficiles à tenir.','Mettez les versements de dette en place le jour où vous êtes payés, avant toute autre dépense.','Fêtez chaque palier atteint, par exemple avec l’escapade : un projet agréable aide à tenir dans la durée.']]
  ];
  h+=`<h3>Pistes concrètes</h3>`+groups.map(g=>`<div class="card"><b>${g[0]}</b><ul class="tips">${g[1].map(t=>`<li>${t}</li>`).join('')}</ul></div>`).join('');
  h+=`<p class="meta">Ces repères sont indicatifs et calculés à partir de vos propres chiffres. Ce n’est pas un conseil financier personnalisé : en cas de doute sur une dette ou un contrat, demandez l’avis d’un professionnel.</p>`;
  return h;
}

const LOGK=[['all','Tout'],['achat','Achats'],['facture','Factures'],['depense','Dépenses'],['dette','Dettes'],['epargne','Épargne'],['repas','Repas'],['mois','Mois']];
function viewHist(){
  let h='';
  h+=`<div class="card"><h2>Mois passés</h2>`;
  h+=S.archive.length?`<div class="tablewrap"><table><thead><tr><th>Mois</th><th class="r">Dépensé</th><th class="r">Dette versée</th><th class="r">Reste</th></tr></thead><tbody>${
    S.archive.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(a=>`<tr><td>${esc(monthLabel(a.month))}</td><td class="r num">${fmt(a.spent)}</td><td class="r num">${fmt(a.debtPaid)}</td><td class="r num">${fmt(a.income-a.spent-a.debtPaid)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty" style="margin:0">Le résumé de chaque mois apparaîtra ici quand vous touchez « Nouveau mois ».</p>';
  h+=`</div><h3>Journal d’activité</h3><div class="chips" style="margin-bottom:10px">${LOGK.map(k=>`<button class="chip" data-act="logk" data-k="${k[0]}" aria-pressed="${ui.logKind===k[0]}">${k[1]}</button>`).join('')}</div>`;
  const list=S.log.filter(e=>ui.logKind==='all'||e.k===ui.logKind);
  if(!list.length)return h+'<div class="card"><p class="empty" style="margin:0">Rien à afficher. Vos achats, versements, factures et repas s’inscrivent ici automatiquement et se retrouvent sur tous vos appareils.</p></div>';
  let day='',body='';
  list.slice(0,ui.logN).forEach(e=>{
    const d=new Date(e.t);const dk=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    if(dk!==day){if(day)body+='</div>';day=dk;body+=`<h3>${esc(dateLabel(dk))}</h3><div class="card">`}
    body+=`<div class="log"><time>${pad(d.getHours())}:${pad(d.getMinutes())}</time><span>${esc(e.msg)}</span></div>`;
  });
  body+='</div>';
  h+=body;
  if(list.length>ui.logN)h+=`<button class="btn ghost" data-act="more">Afficher plus</button>`;
  return h;
}

const VIEWS={home:viewHome,shop:viewShop,fridge:viewFridge,cook:viewCook,bills:viewBills,debt:viewDebt,sav:viewSav,tips:viewTips,hist:viewHist};
function render(){
  calc();nav();$('#app').innerHTML=VIEWS[ui.tab]();
  if(ui.tab==='home'){const a=$('#alerts');if(a)a.innerHTML=alertsHtml()}
  paint();
}

/* ---------- interactions ---------- */
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button data-act="undo">Annuler</button>':'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},7000)}
function mark(){undoJson=JSON.stringify(S)}
function target(col,id){
  if(col==='cfg')return S.cfg;if(col==='env')return S.env;if(col==='save')return S.save;if(col==='esc')return S.esc;
  if(col==='meals')return S.meals[id]||(S.meals[id]={dish:'',ings:[],done:false});
  if(col==='ing'){const [k,i]=id.split('|');const m=S.meals[k];return m&&m.ings.find(x=>x.id===i)}
  return (S[col]||[]).find(x=>x.id===id);
}
const focusVals=new WeakMap();
const app=$('#app');
app.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.col==='debts')focusVals.set(t,t.value)});
app.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.col||t.type==='checkbox')return;
  const o=target(t.dataset.col,t.dataset.id);if(!o)return;
  o[t.dataset.key]=t.value;save();paint();
});
app.addEventListener('change',e=>{
  const t=e.target;if(!t)return;
  if(t.id==='imp'){
    const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const n=normalize(JSON.parse(rd.result));mark();S=n;logEvt('mois','Sauvegarde importée');save();render();toast('Sauvegarde importée.',true)}catch(err){toast('Fichier illisible : choisissez une sauvegarde JSON de cette plateforme.')}};
    rd.readAsText(f);return;
  }
  if(!t.dataset)return;
  if(t.dataset.act==='toggle'){
    const o=target(t.dataset.col,t.dataset.id);if(!o)return;
    o[t.dataset.key]=t.checked;calc();
    if(t.dataset.col==='items'){const l=R['line:'+o.id];logEvt('achat',(t.checked?'Acheté : ':'Achat annulé : ')+o.name+' · '+o.qty+' '+o.unit+(l?' · '+fmt(l):''))}
    if(t.dataset.col==='bills')logEvt('facture',(t.checked?'Facture payée : ':'Paiement annulé : ')+o.name+(num(o.amount)?' · '+fmt(num(o.amount)):''));
    if(t.dataset.col==='debts')logEvt('dette','Dette « '+o.name+' » : '+(t.checked?'principale (comptée dans le reste à vivre)':'mise en veille (non comptée)'));
    save();render();
  }else if(t.dataset.col==='debts'){
    const old=focusVals.get(t),nv=t.value,k=t.dataset.key,d=target('debts',t.dataset.id);
    if(d&&old!==undefined&&old!==nv){
      const lab={due:'échéance',goal:'objectif',total:'montant total',name:'nom',rate:'intérêt'}[k];
      const show=v=>k==='due'?dateLabel(v):(k==='name'?v:k==='rate'?v+' %':fmt(num(v)));
      logEvt('dette','Dette « '+(k==='name'?old:d.name)+' » : '+lab+' '+show(old)+' → '+show(nv));
      focusVals.set(t,nv);save();
    }
  }else if(t.dataset.col&&ui.tab==='home'&&(t.dataset.col==='cfg'||t.dataset.col==='env'))render();
});
function cook(key){
  const m=S.meals[key];if(!m||m.done||!m.ings.length)return;
  const short=[];let n=0;
  m.ings.forEach(g=>{const f=fridgeBy(g.fid);g.applied=0;if(!f||String(f.qty).trim()==='')return;
    const need=num(g.qty),have=num(f.qty),take=Math.min(have,need);
    if(have<need)short.push(f.name);
    f.qty=String(r3(have-take));g.applied=take;n++});
  m.done=true;
  const [d,p]=key.split('-');
  logEvt('repas','Repas cuisiné : '+DAYFULL[d]+(p==='m'?' midi':' soir')+(m.dish?' · '+m.dish:'')+' · '+n+' produit'+(n>1?'s':'')+' retiré'+(n>1?'s':'')+' du stock');
  save();render();
  toast(short.length?'Cuisiné. Stock insuffisant pour : '+short.join(', ')+'.':'Cuisiné : '+n+' produit'+(n>1?'s':'')+' retiré'+(n>1?'s':'')+' du stock.',true);
}
function uncook(key){
  const m=S.meals[key];if(!m||!m.done)return;
  m.ings.forEach(g=>{const f=fridgeBy(g.fid);if(f&&g.applied){f.qty=String(r3(num(f.qty)+g.applied))}g.applied=0});
  m.done=false;const [d,p]=key.split('-');
  logEvt('repas','Repas annulé : '+DAYFULL[d]+(p==='m'?' midi':' soir')+(m.dish?' · '+m.dish:'')+' · stock remis');
  save();render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.type==='checkbox'||b.disabled)return;
  const a=b.dataset.act;
  if(a==='tab'){ui.tab=b.dataset.tab;render();window.scrollTo(0,0)}
  else if(a==='place'){ui.place=b.dataset.place;render()}
  else if(a==='day'){ui.day=b.dataset.day;render()}
  else if(a==='logk'){ui.logKind=b.dataset.k;ui.logN=60;render()}
  else if(a==='more'){ui.logN+=60;render()}
  else if(a==='export')exportData();
  else if(a==='cook')cook(b.dataset.slot);
  else if(a==='uncook')uncook(b.dataset.slot);
  else if(a==='pickTrip'){const t=S.trips.find(x=>x.id===b.dataset.id);if(t){S.esc.dest=t.name;if(num(t.cost)>0)S.esc.budget=t.cost;logEvt('epargne','Prochaine escapade choisie : '+t.name+(num(t.cost)?' · '+fmt(num(t.cost)):''));save();render();toast(t.name+' choisi pour la prochaine escapade.')}}
  else if(a==='delIng'){const m=S.meals[b.dataset.slot];if(m){m.ings=m.ings.filter(x=>x.id!==b.dataset.ing);save();render()}}
  else if(a==='del'){
    mark();const c=b.dataset.col,id=b.dataset.id;const o=S[c].find(x=>x.id===id);
    if(c==='extras'&&o)logEvt('depense','Dépense supprimée : '+o.label+' · '+fmt(num(o.amount)));
    if(c==='pays'&&o){const d=S.debts.find(x=>x.id===o.debtId);logEvt('dette','Versement supprimé : '+fmt(num(o.amount))+(d?' · '+d.name:''))}
    if(c==='debts'&&o){logEvt('dette','Dette supprimée : '+o.name);S.pays=S.pays.filter(p=>p.debtId!==id)}
    if(c==='deposits'&&o)logEvt('epargne','Somme supprimée : '+(DEPK[o.kind]||o.kind)+' · '+fmt(num(o.amount)));
    S[c]=S[c].filter(x=>x.id!==id);save();render();toast('Supprimé',true)}
  else if(a==='undo'){if(undoJson){S=normalize(JSON.parse(undoJson));undoJson=null;save();render();$('#toast').hidden=true}}
  else if(a==='clearMeals'){mark();S.meals={};save();render();toast('Semaine vidée',true)}
  else if(a==='newMonth'){
    mark();calc();const old=S.month;
    const dp=sum(S.pays.filter(p=>(p.date||'').slice(0,7)===old),p=>num(p.amount));
    S.archive=S.archive.filter(x=>x.month!==old);
    S.archive.push({month:old,income:num(S.cfg.income),spent:R.spentSum,debtPaid:dp});
    logEvt('mois','Mois clos : '+monthLabel(old)+' · dépensé '+fmt(R.spentSum)+' · dette versée '+fmt(dp));
    S.month=curMonth();S.items.forEach(i=>i.done=false);S.bills.forEach(x=>x.paid=false);S.extras=[];
    logEvt('mois','Nouveau mois commencé : '+monthLabel(S.month));
    save();render();toast('Nouveau mois commencé',true)}
});
app.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());const k=f.dataset.form;let msg='';
  if(k==='item')S.items.push({id:uid(),cat:d.cat,name:d.name.trim(),unit:(d.unit||'pièce').trim(),qty:d.qty||'1',price:'',done:false});
  if(k==='fridge')S.fridge.push({id:uid(),name:d.name.trim(),place:d.place,unit:(d.unit||'pièce').trim(),qty:d.qty||'',min:d.min||'1',exp:''});
  if(k==='bill')S.bills.push({id:uid(),name:d.name.trim(),amount:d.amount||'',paid:false});
  if(k==='extra'){
    calc();const before=project(R.planDiv);const capBefore=R.margin;
    S.extras.push({id:uid(),label:d.label.trim(),amount:d.amount,date:d.date||today()});
    logEvt('depense','Dépense : '+d.label.trim()+' · '+fmt(num(d.amount)));
    calc();const after=project(R.planDiv);
    if(before.months!==undefined&&after.months!==undefined&&before.months!==0){
      const diff=after.months-before.months;
      const days=capBefore>0?Math.round(num(d.amount)/capBefore*30):0;
      msg=diff>0?`Cette dépense repousse l’objectif d’épargne de ${diff} mois : ${savText(after)}.`:`Objectif d’épargne : ${savText(after)}${days>0?`, soit environ ${days} jour${days>1?'s':''} de retard`:''}.`;
    }else if(after.never)msg='Avec cette dépense, l’objectif d’épargne devient hors de portée au rythme actuel.';
  }
  if(k==='pay'){S.pays.push({id:uid(),debtId:d.debtId,amount:d.amount,date:d.date||today(),note:(d.note||'').trim()});const db=S.debts.find(x=>x.id===d.debtId);logEvt('dette','Versement : '+fmt(num(d.amount))+(db?' · '+db.name:''))}
  if(k==='debt'){S.debts.push({id:uid(),name:d.name.trim(),total:d.total,goal:d.goal||d.total,due:d.due||'',active:true,rate:''});logEvt('dette','Dette ajoutée : '+d.name.trim()+' · '+fmt(num(d.total))+(d.due?' · échéance '+dateLabel(d.due):''))}
  if(k==='ing'){const key=f.dataset.slot;const m=S.meals[key]||(S.meals[key]={dish:'',ings:[],done:false});m.ings.push({id:uid(),fid:d.fid,qty:d.qty,applied:0})}
  if(k==='trip')S.trips.push({id:uid(),name:d.name.trim(),note:(d.note||'').trim(),cost:d.cost||''});
  if(k==='dep'){S.deposits.push({id:uid(),kind:d.kind,amount:d.amount,date:d.date||today(),note:(d.note||'').trim()});logEvt('epargne',(DEPK[d.kind]||d.kind)+' : '+fmt(num(d.amount))+(d.note?' · '+d.note.trim():''));calc();msg=d.kind==='epargne'?'Épargne enregistrée. Objectif : '+savText(project(R.planDiv))+'.':''}
  save();render();if(msg)toast(msg);
});

render();
initStore();
})();
</script>
